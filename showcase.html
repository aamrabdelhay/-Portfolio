<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Project Showcase</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700&family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f4f0;--ink:#18202a;--muted:#637083;--accent:#c9a227;--dark:#0a1f44;--line:#dfe3e8}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,sans-serif}a{text-decoration:none;color:inherit}.bar{position:sticky;top:0;z-index:200;background:#070b14;color:#f6f1e6;display:flex;justify-content:space-between;gap:12px;align-items:center;padding:9px 18px;font-size:11px}.bar a,.bar b{color:#d4af51}.nav{position:sticky;top:36px;z-index:120;display:flex;align-items:center;justify-content:space-between;gap:22px;padding:16px clamp(16px,5vw,60px);background:rgba(255,255,255,.91);backdrop-filter:blur(15px);border-bottom:1px solid rgba(0,0,0,.08)}.logo{font-family:"Cormorant Garamond",serif;font-size:27px;letter-spacing:.08em}.navlinks{display:flex;gap:21px;flex-wrap:wrap;font-size:12px}.navlinks a:hover{color:var(--accent)}.hero{padding:78px clamp(20px,7vw,90px);min-height:57vh;display:grid;grid-template-columns:1.15fr .85fr;gap:30px;align-items:center}.hero h1{font-size:clamp(38px,6vw,72px);line-height:1.16;margin:12px 0 18px}.eyebrow{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);font-weight:700}.hero p{max-width:700px;line-height:1.95;color:var(--muted);font-size:15px}.cta{display:inline-flex;border:1px solid var(--accent);background:var(--accent);color:#101827;padding:12px 20px;font:700 12px Cairo;cursor:pointer}.cta.alt{background:transparent;color:var(--accent)}.visual{min-height:390px;border-radius:18px;background:linear-gradient(145deg,rgba(0,0,0,.12),rgba(0,0,0,.48)),var(--hero) center/cover;box-shadow:0 30px 60px -30px rgba(0,0,0,.4)}.section{padding:72px clamp(20px,6vw,80px)}.section.alt{background:#fff}.head{text-align:center;max-width:820px;margin:0 auto 35px}.head h2{font-size:clamp(31px,5vw,50px);margin:10px 0}.head p{color:var(--muted);line-height:1.9;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;max-width:1180px;margin:auto}.card{background:rgba(255,255,255,.74);border:1px solid var(--line);padding:24px;border-radius:14px;min-height:175px}.card h3{margin:8px 0;font-size:20px}.card p{margin:0;color:var(--muted);line-height:1.85;font-size:12px}.metric{font-size:28px;color:var(--accent);font-weight:700}.dark{background:linear-gradient(135deg,#0a101d,#17253b);color:#fff}.dark .head p,.dark .card p{color:#c3cddd}.dark .card{background:rgba(255,255,255,.055);border-color:rgba(212,175,81,.22)}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;max-width:1180px;margin:auto}.product{overflow:hidden;background:#12100f;border:1px solid #3c3330;border-radius:12px;color:#f6eee4}.product img{width:100%;height:255px;object-fit:cover;display:block}.product .pad{padding:17px}.price{color:#e8b4b8}.product button{width:100%;margin-top:10px;padding:10px;border:1px solid #e8b4b8;background:transparent;color:#e8b4b8;cursor:pointer}.list{display:grid;gap:10px;max-width:900px;margin:auto}.row{display:flex;justify-content:space-between;gap:15px;align-items:center;padding:15px 18px;border:1px solid var(--line);background:#fff;border-radius:11px}.row small{color:var(--muted)}.pill{border-radius:999px;padding:5px 9px;background:#eef3f7;color:#31516d;font-size:10px}.footer{padding:30px 6vw;border-top:1px solid var(--line);font-size:11px;color:#707986}.modal{position:fixed;inset:0;background:rgba(5,8,15,.7);display:none;place-items:center;z-index:250;padding:20px}.modal.open{display:grid}.modalbox{width:min(500px,100%);background:#fff;color:#18202a;padding:26px;border-radius:15px}.modalbox p{color:var(--muted);line-height:1.85;font-size:13px}.close{border:1px solid #b9c1cb;background:#fff;padding:9px 16px;cursor:pointer}
@media(max-width:900px){.hero{grid-template-columns:1fr}.visual{min-height:300px}.grid,.products{grid-template-columns:1fr 1fr}.navlinks{display:none}}@media(max-width:600px){.grid,.products{grid-template-columns:1fr}.hero{padding-top:55px}.bar{font-size:10px}}
</style>
</head>
<body>
<div id="app"></div>
<div class="modal" id="modal"><div class="modalbox"><h3 id="mt">Showcase</h3><p id="mp"></p><button class="close" onclick="closeModal()">إغلاق</button></div></div>
<script>
var root=document.getElementById('app'), modal=document.getElementById('modal'), mt=document.getElementById('mt'), mp=document.getElementById('mp');
var project=(new URLSearchParams(location.search)).get('project')||'elsharaby';
var base='../../images/';
var configs={
elsharaby:{name:'EL SHARABY LAW',accent:'#c9a227',dark:'#0a1f44',hero:base+'court.jpg',title:'El Sharaby Law',subtitle:'STUDENT LEGAL PLATFORM · S.L.C MOOT COURT',desc:'نسخة Showcase مستقلة مبنية على تجربة المشروع الأصلية في شكل آمن للعرض. التسجيلات والفرق والمقالات هنا تجريبية ولا يوجد أي اتصال بالنظام الحقيقي.',sections:['About','Fields','S.L.C','Insights'],cards:[['Advocacy','مرافعات ومذكرات وتدريب على الترافع الشفهي.'],['Research','بحث قانوني وكتابة ثنائية اللغة ضمن تجربة أكاديمية منظمة.'],['Community','أنشطة وفعاليات وسجل عام للمسابقة بدون كشف بيانات الأعضاء.']]},
hossam:{name:'د. حسام لطفي',accent:'#d4af51',dark:'#0a101d',hero:base+'office.jpg',title:'منصة إدارة مكتب المحاماة',subtitle:'LAW OFFICE OPERATIONS PLATFORM',desc:'نسخة عرض معزولة لتجربة المنصة: لوحة تشغيل، جلسات، قضايا، فروع ومهام. كل الأسماء والأعداد والملفات تجريبية ولا توجد قاعدة بيانات خلفها.',sections:['لوحة المكتب','القضايا','الجلسات','الفروع'],cards:[['الجلسات والمواعيد','تجميع للمواعيد القادمة مع حالات الأولوية والإجراءات.'],['القضايا والملفات','ملفات وقضايا مرتبطة بمحامين ومراحل عمل افتراضية.'],['الفروع والصلاحيات','تصور للفروع المستقلة مع صلاحيات الإدارة المركزية.']]},
loutfi:{name:'مكتب لطفي للمحاماة',accent:'#9f7e2c',dark:'#1b1b1b',hero:base+'research.jpg',title:'حيث يُكتب القانون بهدوء.',subtitle:'LOUTFI LAW FIRM · CONTENT & MEDIA',desc:'نسخة Showcase مستقلة من الواجهة العامة: خدمات قانونية، أكاديميا، مقالات ووسائط. لا توجد أي بيانات أو API من الموقع الأصلي.',sections:['عن المكتب','الخدمات','الأكاديميا','الإعلام'],cards:[['التحكيم','عرض للخدمات والمجالات القانونية بأسلوب هادئ ومنظم.'],['التقاضي والعقود','صفحات خدمة قابلة للتوسع للمحتوى التحريري.'],['الأكاديميا والإعلام','كتب ومحاضرات ومقالات ومقاطع ضمن هيكل المحتوى.']]},
safa:{name:'SAFA',accent:'#e8b4b8',dark:'#0d0c0b',hero:base+'cosmetics.jpg',title:'Beauty, refined.',subtitle:'LUXURY COSMETICS STOREFRONT',desc:'نسخة Showcase مستقلة من تجربة SAFA: كتالوج، أقسام، منتج وحقيبة تجريبية. المنتجات والأسعار هنا وهمية ولا توجد طلبات أو API أو مخزون حقيقي.',sections:['Shop','Rituals','Bag'],cards:[['Skin','روتين هادئ ومنتجات مختارة بعناية.'],['Body','تفاصيل بسيطة وتجربة متجر فاخرة.'],['Atelier','تصور للإدارة والمخزون داخل المشروع الأصلي.']]},
mo:{name:'جامعة العاصمة · إدارة الزيارات',accent:'#b49724',dark:'#07507f',hero:base+'hero.jpg',title:'زيارتك اليوم، وعيٌ لوطنك غداً',subtitle:'STUDENT MILITARY VISITS MANAGEMENT',desc:'نسخة Showcase مستقلة من تجربة نظام إدارة الزيارات: زيارات قادمة، تعليمات، تسجيل تجريبي ولوحات إدارة. جميع الطلاب والمشرفين والأرقام هنا بيانات وهمية.',sections:['الزيارات القادمة','التعليمات','عن البرنامج'],cards:[['الزيارات القادمة','بطاقات للموعد والمكان والسعة والحالة.'],['التسجيل','نموذج شكلي لا يرسل أو يحفظ أي بيانات.'],['الإدارة','تصور للمتابعة والإحصائيات والتقارير.']]}
};
var c=configs[project]||configs.elsharaby;
document.title=c.name+' — Showcase';
document.documentElement.style.setProperty('--accent',c.accent);
document.documentElement.style.setProperty('--dark',c.dark);
var links=''; for(var i=0;i<c.sections.length;i++) links+='<a href="#s'+i+'">'+c.sections[i]+'</a>';
var cards=''; for(var j=0;j<c.cards.length;j++) cards+='<article class="card"><div class="metric">0'+(j+1)+'</div><h3>'+c.cards[j][0]+'</h3><p>'+c.cards[j][1]+'</p><button class="cta alt" onclick="safeAction(\'العنصر '+c.cards[j][0]+' يعمل داخل النسخة التجريبية فقط.\')">فتح</button></article>';
var html='<div class="bar"><a href="./#work" onclick="returnBack(event)">← Back to portfolio</a><b>SHOWCASE COPY · NO LIVE DATA</b></div>';
html+='<header class="nav"><a class="logo" href="#home">'+c.name+'</a><nav class="navlinks">'+links+'</nav><button class="cta alt" onclick="safeAction(\'هذا زر عرض فقط — لا يوجد اتصال بالمشروع الأصلي.\')">Showcase</button></header>';
html+='<section class="hero" id="home"><div><div class="eyebrow">'+c.subtitle+'</div><h1>'+c.title+'</h1><p>'+c.desc+'</p><button class="cta" onclick="document.getElementById(\'s0\').scrollIntoView({behavior:\'smooth\'})">Explore ↗</button></div><div class="visual" style="--hero:url(\''+c.hero+'\')"></div></section>';
html+='<section class="section alt" id="s0"><div class="head"><div class="eyebrow">01 — PROJECT</div><h2>'+c.name+'</h2><p>'+c.desc+'</p></div><div class="grid">'+cards+'</div></section>';
if(project==='safa'){
 html+='<section class="section dark" id="s1"><div class="head"><div class="eyebrow">SAFA / COLLECTION</div><h2>The edit</h2><p>Demo products only — no orders, no customer records, no live inventory.</p></div><div class="products">';
 var ps=[['No. 01 · Rose Veil','890 EGP',base+'cosmetics.jpg'],['No. 02 · Silk Balm','760 EGP',base+'hero.jpg'],['No. 03 · Night Bloom','820 EGP',base+'research.jpg']];
 for(var k=0;k<ps.length;k++) html+='<article class="product"><img src="'+ps[k][2]+'" alt=""><div class="pad"><div class="eyebrow">DEMO PRODUCT</div><h3>'+ps[k][0]+'</h3><div class="price">'+ps[k][1]+' · demo</div><button onclick="safeAction(\''+ps[k][0]+' تمت إضافته إلى حقيبة العرض فقط.\')">ADD TO BAG</button></div></article>';
 html+='</div></section>';
}else if(project==='hossam'){
 html+='<section class="section" id="s1"><div class="head"><div class="eyebrow">CASES & FILES</div><h2>لوحة تشغيل مصغرة</h2><p>بيانات تجريبية لعرض واجهة المنصة.</p></div><div class="list">';
 var cases=['CASE-2026-014 · عقد تجاري','CASE-2026-022 · نزاع مدني','CASE-2026-031 · تحكيم'];
 for(var q=0;q<cases.length;q++) html+='<div class="row"><div><b>'+cases[q]+'</b><small>مسؤول تجريبي · آخر تحديث اليوم</small></div><span class="pill">'+['تحت المراجعة','جلسة قادمة','مفتوح'][q]+'</span></div>';
 html+='</div></section>';
}else if(project==='mo'){
 html+='<section class="section alt" id="s1"><div class="head"><div class="eyebrow">UPCOMING VISITS</div><h2>الزيارات القادمة</h2><p>3 زيارات تجريبية فقط.</p></div><div class="grid">';
 var vs=[['متحف نموذجي','الأحد · 12 أكتوبر 2026',base+'court.jpg'],['منشأة تدريبية','الأربعاء · 16 أكتوبر 2026',base+'office.jpg'],['معرض تاريخي','الاثنين · 20 أكتوبر 2026',base+'hero.jpg']];
 for(var w=0;w<vs.length;w++) html+='<article class="card"><img src="'+vs[w][2]+'" style="width:100%;height:170px;object-fit:cover;border-radius:9px" alt=""><h3>'+vs[w][0]+'</h3><p>'+vs[w][1]+' · سعة تجريبية</p><button class="cta" onclick="safeAction(\'تسجيل تجريبي فقط — لا يتم حفظ أو إرسال أي بيانات.\')">سجل</button></article>';
 html+='</div></section>';
}else{
 html+='<section class="section dark" id="s1"><div class="head"><div class="eyebrow">02 — EXPERIENCE</div><h2>واجهة المشروع</h2><p>عناصر عرض مستوحاة من البنية الأصلية، مع محتوى مستقل وآمن للـPortfolio.</p></div><div class="grid">'+cards+'</div></section>';
}
html+='<section class="section" id="s2"><div class="head"><div class="eyebrow">03 — SAFE SHOWCASE</div><h2>نسخة مستقلة للعرض</h2><p>لا توجد هنا قاعدة بيانات أو تسجيل دخول حقيقي أو API أو ملفات العملاء أو بيانات الزوار أو الطلبات الخاصة بالمشروع الأصلي.</p></div></section>';
html+='<footer class="footer">SHOWCASE COPY · '+c.name+' · Portfolio demonstration only · not connected to the original website</footer>';
root.innerHTML=html;
function safeAction(t){mt.textContent='وضع العرض فقط';mp.textContent=t;modal.classList.add('open')}
function closeModal(){modal.classList.remove('open')}
function returnBack(e){e.preventDefault();location.href='./#work'}
</script></body></html>
